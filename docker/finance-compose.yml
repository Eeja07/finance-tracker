services:
  finance-tracker-redis:
    image: redis:7-alpine
    container_name: finance-tracker-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  finance-tracker-api:
    build:
      context: /opt/apps/finance-tracker
      dockerfile: apps/api/Dockerfile
    container_name: finance-tracker-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://eeja:eejamakkutujuh@postgres:5432/finance-tracker?schema=public
      REDIS_HOST: finance-tracker-redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: finance-tracker-access-secret-key-2026-secure
      JWT_REFRESH_SECRET: finance-tracker-refresh-secret-key-2026-secure
      WA_GATEWAY_URL: http://gateway-whatsapp-bot:3001
      WA_GATEWAY_API_KEY: eeja_wa_gateway_secret_key_2026
      FRONTEND_URL: https://finance.eeja.fun
    volumes:
      - api_storage:/app/apps/api/storage/uploads
    depends_on:
      finance-tracker-redis:
        condition: service_healthy
    networks:
      - homelab

  finance-tracker-web:
    build:
      context: /opt/apps/finance-tracker
      dockerfile: apps/web/Dockerfile
    container_name: finance-tracker-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: https://finance.eeja.fun/api
    depends_on:
      - finance-tracker-api
    networks:
      - homelab

networks:
  homelab:
    external: true

volumes:
  redis_data:
  api_storage:
